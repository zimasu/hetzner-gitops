apiVersion: v1
kind: PersistentVolume
metadata:
  name: noco-pv
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/noco
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: noco-pvc
  namespace: noco
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  volumeName: noco-pv
  storageClassName: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: noco-postgres-secret
  namespace: noco
type: Opaque
stringData:
  POSTGRES_USER: nocodb
  POSTGRES_PASSWORD: de09ee8e9590fc3a12be07cbcf56b6d5
  POSTGRES_DB: nocodb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noco-postgres
  namespace: noco
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noco-postgres
  template:
    metadata:
      labels:
        app: noco-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: noco-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: noco-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: noco-postgres
  namespace: noco
spec:
  selector:
    app: noco-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nocodb
  namespace: noco
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nocodb
  template:
    metadata:
      labels:
        app: nocodb
    spec:
      containers:
        - name: nocodb
          image: nocodb/nocodb:latest
          ports:
            - containerPort: 8080
          env:
            - name: NC_DB
              value: pg://noco-postgres:5432?u=nocodb&p=de09ee8e9590fc3a12be07cbcf56b6d5&d=nocodb
            - name: NC_PUBLIC_URL
              value: https://noco.zidanesyukri.me
          volumeMounts:
            - name: data
              mountPath: /usr/app/data
              subPath: app
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: noco-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nocodb
  namespace: noco
spec:
  selector:
    app: nocodb
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nocodb
  namespace: noco
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [noco.zidanesyukri.me]
      secretName: noco-tls
  rules:
    - host: noco.zidanesyukri.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nocodb
                port:
                  number: 8080
