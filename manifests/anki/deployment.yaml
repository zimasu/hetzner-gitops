apiVersion: apps/v1
kind: Deployment
metadata:
  name: anki
  namespace: anki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anki
  template:
    metadata:
      labels:
        app: anki
    spec:
      containers:
        - name: anki
          image: ghcr.io/z0rrn/anki-sync-server:latest
          ports:
            - containerPort: 27701
          env:
            - name: SYNC_USER1
              valueFrom:
                secretKeyRef:
                  name: anki-credentials
                  key: SYNC_USER1
          volumeMounts:
            - name: data
              mountPath: /anki_data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anki-data
