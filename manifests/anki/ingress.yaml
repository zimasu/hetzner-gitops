apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anki
  namespace: anki
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: anki.zidanesyukri.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: anki
                port:
                  number: 27701
  tls:
    - hosts:
        - anki.zidanesyukri.me
      secretName: anki-tls
