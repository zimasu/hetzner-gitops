apiVersion: apps/v1
kind: Deployment
metadata:
  name: mkdocs
  namespace: mkdocs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mkdocs
  template:
    metadata:
      labels:
        app: mkdocs
    spec:
      containers:
        - name: mkdocs
          image: ghcr.io/zimasu/docs:688c6a766b631790c0af7d682910003d767d1ef3
          imagePullPolicy: Always
          ports:
            - containerPort: 80
