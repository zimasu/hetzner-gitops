apiVersion: apps/v1
kind: Deployment
metadata:
  name: mkdocs
  namespace: mkdocs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mkdocs
  template:
    metadata:
      labels:
        app: mkdocs
    spec:
      containers:
        - name: mkdocs
          image: ghcr.io/zimasu/docs:923ec8b607b7c224227b50da259072d9c5322b78
          imagePullPolicy: Always
          ports:
            - containerPort: 80
