apiVersion: apps/v1
kind: Deployment
metadata:
  name: mkdocs
  namespace: mkdocs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mkdocs
  template:
    metadata:
      labels:
        app: mkdocs
    spec:
      containers:
        - name: mkdocs
          image: ghcr.io/zimasu/docs:daf84413c423dc061157a15da649fec796726149
          imagePullPolicy: Always
          ports:
            - containerPort: 80
