apiVersion: apps/v1
kind: Deployment
metadata:
  name: mkdocs
  namespace: mkdocs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mkdocs
  template:
    metadata:
      labels:
        app: mkdocs
    spec:
      containers:
        - name: mkdocs
          image: ghcr.io/zimasu/docs:27f89cc48b332eafacc4fa44bce3d527a2cafa32
          imagePullPolicy: Always
          ports:
            - containerPort: 80
