apiVersion: apps/v1
kind: Deployment
metadata:
  name: mkdocs
  namespace: mkdocs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mkdocs
  template:
    metadata:
      labels:
        app: mkdocs
    spec:
      containers:
        - name: mkdocs
          image: ghcr.io/zimasu/docs:e9c7850a34b6b9f7ed2d56776d3bb28878d9c9a1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
