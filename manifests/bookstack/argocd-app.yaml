apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookstack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/zimasu/hetzner-gitops.git
    targetRevision: HEAD
    path: manifests/bookstack
  destination:
    server: https://kubernetes.default.svc
    namespace: bookstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
