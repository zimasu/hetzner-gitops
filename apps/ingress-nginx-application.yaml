apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.11.3
    helm:
      values: |
        controller:
          config:
            allow-snippet-annotations: "false"
          extraArgs:
            default-backend-service: ingress-nginx/default-backend
        defaultBackend:
          enabled: true
          image:
            repository: nginx
            tag: alpine
          extraVolumes:
            - name: nginx-conf
              configMap:
                name: default-backend-conf
          extraVolumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
